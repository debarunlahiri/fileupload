# ---- database (default: file based H2; point to your own DB in production) ----
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/fileupload;MODE=MySQL
db.username=sa
db.password=

# ---- where uploaded files are stored on disk ----
app.file.root=./data/upload
# blocked extensions (comma separated)
app.file.deny-ext=exe,bat,cmd,sh,jsp,jspx,php,dll,com,js
